modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/Tsutsutsuu/voxy-map/issues"

[[mods]]
modId = "voxymap"
version = "${version}"
displayName = "Voxy Map"
authors = "Tsutsutsuu"
credits = "Map data comes from Voxy; rendering is inspired by SeedGen's storage layout."
displayURL = "https://github.com/Tsutsutsuu/voxy-map"
logoFile = "icon.png"
logoBlur = false
description = '''
A fullscreen world map drawn straight from Voxy's level-of-detail storage.

Voxy Map reads the RocksDB storage Voxy keeps for each world, decodes every LOD
level into a unified tile store and draws the whole explored world as a clean map -
no chunk loading, no in-game visiting.

- Six colour palettes: natural, gradient, GMT, nautical, gradient-turbo, gradient-soft
- Contour lines, hillshade, water depth shading, ocean blur, optional hole filling
- Biome boundary overlay and biome labels
- Unified per-tile 2D rendering (256x256 tile textures streamed from Voxy's live
  section updates) with a per-world disk cache
- GPU 3D terrain view: every map tile is meshed on a worker and drawn with its own
  vertex/index buffers and a texture atlas, with three precision levels, frustum
  culling, seams hidden by skirts and a render-distance ribbon
- Self-drawn six-tab config screen (General / Map / Map data / 3D View / Perf /
  Debug) with draft apply/cancel/reset, sliders and typed values
- Zoom, pan, render-distance box, coordinates and a right-click menu
  (copy coordinates / teleport / export PNG)
- Nine languages, biome names from the game's own language entries

Controls: N opens the map, scroll to zoom, drag to pan, Space re-centres on the
player, middle click (or the 3D button) switches between the 2D map and the 3D
terrain view.

Works best together with Voxy SeedGen, which fills Voxy's storage from the world seed.
'''

[[dependencies.voxymap]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.voxymap]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "CLIENT"

# Voxy (through the Roxy bridge on NeoForge) is what this mod reads; without it the map
# has no data and simply reports that no storage was found, so the dependency stays optional.
[[dependencies.voxymap]]
modId = "voxy"
type = "optional"
versionRange = "[0.2.0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.voxymap]]
modId = "roxy"
type = "optional"
versionRange = "[0.4.0,)"
ordering = "AFTER"
side = "CLIENT"

# skips the world render pass while the fullscreen map is open (see GameRendererMixin)
[[mixins]]
config = "voxymap.mixins.json"
